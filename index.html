<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Links</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        a {
            display: block;
            width: 260px;
            padding: 15px;
            text-align: center;
            text-decoration: none;
            color: #fff;
            border: 1px solid #fff;
            border-radius: 8px;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }

        a:hover {
            background-color: #fff;
            color: #000;
        }
    </style>
</head>
<body>
    <h1>Meus Links</h1>

    <!-- Edite o href e o texto de cada link abaixo -->

    <a href="https://site1.com" target="_blank">Link 1</a>
    <a href="https://site2.com" target="_blank">Link 2</a>
    <a href="https://site3.com" target="_blank">Link 3</a>
    <a href="https://site4.com" target="_blank">Link 4</a>

</body>
</html>
